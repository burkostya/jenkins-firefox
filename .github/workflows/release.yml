name: Publish GitHub release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify release tag and versions
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"

          printf 'tag version:      %s\n' "$version"
          printf 'package version:  %s\n' "$package_version"
          printf 'manifest version: %s\n' "$manifest_version"

          test "$tag" = "v${version}"
          test "$version" = "$package_version"
          test "$version" = "$manifest_version"

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to release: tagged commit is not contained in origin/main" >&2
            exit 1
          fi

      - name: Build and unit tests
        run: |
          npm run build
          npm test

      - name: Verify built manifest version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          built_version="$(node -p "require('./extension/manifest.json').version")"
          test "$version" = "$built_version"

      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path + '\n')
          PY

      - name: Chromium DOM regressions (mocked API)
        run: |
          npm run test:browser
          npm run test:flow-browser
          npm run test:overview-browser

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="pipeline-graph-local-firefox-${version}.zip"

          mkdir -p dist
          (
            cd extension
            zip -q -r "../dist/${archive}" .
          )
          (
            cd dist
            sha256sum "$archive" > "${archive}.sha256"
          )

          unzip -t "dist/${archive}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="pipeline-graph-local-firefox-${version}.zip"

          gh release create "$GITHUB_REF_NAME" \
            "dist/${archive}" \
            "dist/${archive}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Pipeline Graph Local ${GITHUB_REF_NAME}"
