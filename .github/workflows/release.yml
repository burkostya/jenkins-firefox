name: Publish GitHub release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve and verify release version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"

          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "Refusing to release: package.json is ${package_version}, manifest.json is ${manifest_version}" >&2
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to release: source version ${package_version} is not X.Y.Z SemVer" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$package_version"
            tag="v${version}"

            main_sha="$(git rev-parse origin/main)"
            if [[ "$release_sha" != "$main_sha" ]]; then
              echo "Refusing to release: checked out commit is not the current origin/main" >&2
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Refusing to release: ${tag} already exists. Bump package.json and manifest.json in a PR before creating the next release." >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unexpected release tag: ${tag}" >&2
              exit 1
            fi
            version="${tag#v}"

            if ! git merge-base --is-ancestor "$release_sha" origin/main; then
              echo "Refusing to release: tagged commit is not contained in origin/main" >&2
              exit 1
            fi

            if [[ "$version" != "$package_version" ]]; then
              echo "Refusing to release: tag ${tag} does not match source version ${package_version}" >&2
              exit 1
            fi
          fi

          printf 'release event:     %s\n' "$GITHUB_EVENT_NAME"
          printf 'release tag:       %s\n' "$tag"
          printf 'release SHA:       %s\n' "$release_sha"
          printf 'package version:   %s\n' "$package_version"
          printf 'manifest version:  %s\n' "$manifest_version"

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Build and unit tests
        run: |
          npm run build
          npm test

      - name: Verify built manifest version
        shell: bash
        run: |
          set -euo pipefail
          built_version="$(node -p "require('./extension/manifest.json').version")"
          test "$RELEASE_VERSION" = "$built_version"

      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path + '\n')
          PY

      - name: Chromium DOM regressions (mocked API)
        run: |
          npm run test:browser
          npm run test:flow-browser
          npm run test:overview-browser

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          archive="pipeline-graph-local-firefox-${RELEASE_VERSION}.zip"

          mkdir -p dist
          (
            cd extension
            zip -q -r "../dist/${archive}" .
          )
          (
            cd dist
            sha256sum "$archive" > "${archive}.sha256"
          )

          unzip -t "dist/${archive}"

      - name: Publish existing pushed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="pipeline-graph-local-firefox-${RELEASE_VERSION}.zip"

          gh release create "$RELEASE_TAG" \
            "dist/${archive}" \
            "dist/${archive}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Pipeline Graph Local ${RELEASE_TAG}"

      - name: Create tag and publish manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="pipeline-graph-local-firefox-${RELEASE_VERSION}.zip"

          gh release create "$RELEASE_TAG" \
            "dist/${archive}" \
            "dist/${archive}.sha256" \
            --target "$RELEASE_SHA" \
            --generate-notes \
            --title "Pipeline Graph Local ${RELEASE_TAG}"
