name: Extension tests and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Offline source build and unit tests
        run: |
          npm run build
          npm test
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path + '\n')
          PY
      - name: Chromium DOM regressions (mocked API)
        run: |
          npm run test:browser
          npm run test:flow-browser
          npm run test:overview-browser
          python tests/build_page_browser_test.py
      - name: Package unsigned Firefox extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-graph-local-firefox
          path: extension/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test screenshots and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            test-results/
            tests/BROWSER-TEST-REPORT.json
            tests/FLOW-BROWSER-TEST-REPORT.json
          retention-days: 14
